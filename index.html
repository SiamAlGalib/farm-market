<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.firebaseapp.com https://*.googleapis.com https://fcm.googleapis.com;">
  <title>Farm Market – Add Product</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>New Product</h1>
  <form id="productForm">
    <label>Product name:<br><input type="text" id="name" required></label><br><br>
    <label>Price per kg:<br><input type="number" id="price" step="0.01" required></label><br><br>
    <label>Photo:<br>
      <input type="file" accept="image/*" id="photoInput" class="btn" />
    </label><br>
    <img id="photoPreview" class="preview" alt="preview" />
    <div id="loader">Uploading…</div><br>
    <button type="submit" class="btn">Save Product</button>
    <span id="notifStatus" class="icon-bell disabled" title="Enable notifications"></span>
  </form>

  <script type="module">
    // ---- Firebase init (modular SDK) ----
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";
    import { compressImage } from "./utils/compressImage.js";
    import { initPushNotifications } from "./messaging.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // expose globals for messaging.js (used for push init)
    window.firebaseApp = app;
    window.auth = auth;
    window.db = db;

    // ---- Notification UI ----
    const notifIcon = document.getElementById('notifStatus');
    function updateNotifUI() {
      const granted = Notification.permission === 'granted';
      notifIcon.classList.toggle('enabled', granted);
      notifIcon.classList.toggle('disabled', !granted);
    }
    updateNotifUI();
    notifIcon.addEventListener('click', async () => {
      if (Notification.permission !== 'granted') {
        await initPushNotifications().catch(console.error);
        updateNotifUI();
      }
    });

    // ---- Photo handling ----
    const photoInput = document.getElementById('photoInput');
    const previewImg = document.getElementById('photoPreview');
    const loader = document.getElementById('loader');
    let compressedBlob = null;
    photoInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Please select an image.'); return; }
      try {
        compressedBlob = await compressImage(file, 200);
        previewImg.src = URL.createObjectURL(compressedBlob);
        previewImg.style.display = 'block';
      } catch (err) {
        console.error(err);
        alert('Compression failed');
      }
    });

    // ---- Form submit ----
    document.getElementById('productForm').addEventListener('submit', async ev => {
      ev.preventDefault();
      const name = document.getElementById('name').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      if (!auth.currentUser) { alert('Please log in first'); return; }
      loader.style.display = 'block';
      let photoUrl = '';
      if (compressedBlob) {
        const uid = auth.currentUser.uid;
        const path = `productPhotos/${uid}/${Date.now()}.jpg`;
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, compressedBlob, { contentType: 'image/jpeg' });
        photoUrl = await getDownloadURL(storageRef);
      }
      try {
        await addDoc(collection(db, 'products'), {
          name,
          price,
          photoUrl,
          farmerId: auth.currentUser.uid,
          createdAt: new Date().toISOString()
        });
        alert('Product saved');
        ev.target.reset();
        previewImg.style.display = 'none';
        compressedBlob = null;
      } catch (e) {
        console.error(e);
        alert('Failed to save product');
      } finally {
        loader.style.display = 'none';
      }
    });

    // Prompt for notifications once after login
    onAuthStateChanged(auth, user => {
      if (user && Notification.permission === 'default') {
        // optional: initPushNotifications();
      }
    });
  </script>
</body>
</html>
