<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP: no unsafe‑inline, all scripts must be external -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.firebaseapp.com https://*.googleapis.com;">
  <title>Order Tracker</title>
  <style>
    body {font-family: Arial, sans-serif; margin:20px;}
    #enable-notif {padding:10px 20px; font-size:1rem;}
    #lang-toggle {margin-left:10px; padding:5px 10px;}
  </style>
</head>
<body>
  <h1 data-i18n="welcome">Welcome</h1>
  <button id="enable-notif">নোটিফিকেশন চালু করুন / Enable Notifications</button>
  <button id="lang-toggle" aria-label="Toggle language"></button>

  <!-- External scripts -->
  <script type="module" src="/app.js"></script>
  <script type="module" src="/messaging.js"></script>
</body>
</html>
