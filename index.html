<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.firebaseapp.com https://*.googleapis.com;">
  <title>Farm Market – Add Product</title>
  <style>
    body {font-family:Arial,sans-serif;margin:20px;}
    .btn {display:inline-block;padding:12px 24px;background:#28a745;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer;}
    .preview {margin-top:10px;max-width:100%;height:auto;display:none;}
    #loader {display:none;}
  </style>
</head>
<body>
  <h1>New Product</h1>
  <form id="productForm">
    <label>Product name:<br><input type="text" id="name" required></label><br><br>
    <label>Price per kg:<br><input type="number" id="price" step="0.01" required></label><br><br>
    <label>Photo:<br>
      <input type="file" accept="image/*" id="photoInput" class="btn" />
    </label><br>
    <img id="photoPreview" class="preview" alt="preview" />
    <div id="loader">Uploading…</div><br>
    <button type="submit" class="btn">Save Product</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js";
    import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js";
    import { compressImage } from "./utils/compressImage.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const photoInput = document.getElementById('photoInput');
    const previewImg = document.getElementById('photoPreview');
    const loader = document.getElementById('loader');
    let compressedBlob = null; // will hold result of compression

    photoInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Please select an image.'); return; }
      // compress (max 200KB)
      try { compressedBlob = await compressImage(file, 200); }
      catch(err){ console.error(err); alert('Compression failed'); return; }
      const url = URL.createObjectURL(compressedBlob);
      previewImg.src = url;
      previewImg.style.display = 'block';
    });

    document.getElementById('productForm').addEventListener('submit', async ev => {
      ev.preventDefault();
      const name = document.getElementById('name').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      if (!auth.currentUser) { alert('Please log in first'); return; }
      loader.style.display = 'block';
      let photoUrl = '';
      if (compressedBlob) {
        const uid = auth.currentUser.uid;
        const path = `productPhotos/${uid}/${Date.now()}.jpg`;
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, compressedBlob, {contentType:'image/jpeg'});
        photoUrl = await getDownloadURL(storageRef);
      }
      await addDoc(collection(db, 'products'), { name, price, photoUrl, farmerId: auth.currentUser.uid, createdAt: new Date().toISOString() });
      loader.style.display = 'none';
      alert('Product saved');
      // reset form
      ev.target.reset();
      previewImg.style.display = 'none';
      compressedBlob = null;
    });
  </script>
</body>
</html>
